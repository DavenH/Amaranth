<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saxophone reference listening</title>
<style>
  :root { color-scheme: light; --paper:#f7f6f1; --surface:#fffefa; --ink:#292c25; --muted:#696d62; --line:#dedfd5; --olive:#535d37; --wash:#edf0e2; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  button,input,select,textarea { font:inherit; }
  button,select,input[type="search"] { min-height:36px; border:1px solid #cdd0c3; border-radius:6px; background:var(--surface); color:var(--ink); }
  button { padding:6px 12px; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--wash); border-color:#a3ad8b; }
  button:disabled { cursor:default; color:#85897d; background:#f0f0e9; }
  :focus-visible { outline:2px solid var(--olive); outline-offset:3px; }
  a { color:var(--olive); text-underline-offset:3px; }
  main { max-width:1280px; margin:auto; padding:28px 28px 48px; }
  header { display:flex; align-items:center; gap:24px; justify-content:space-between; margin-bottom:16px; }
  h1 { margin:0; font-size:25px; line-height:1.2; font-weight:650; letter-spacing:-.5px; }
  #export-audit { flex:none; }
  .player { position:sticky; top:0; z-index:2; display:grid; grid-template-columns:minmax(180px,1fr) auto minmax(260px,360px); gap:18px; align-items:center; padding:12px 0; margin-bottom:12px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--paper); }
  .player-copy { min-width:0; }
  #now-playing { display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #player-detail { display:block; color:var(--muted); font-size:12px; }
  .transport { display:flex; gap:5px; }
  .transport button { padding:6px 10px; }
  #repeat[aria-pressed="true"] { background:var(--wash); border-color:var(--olive); box-shadow:inset 0 -2px var(--olive); }
  audio { width:100%; height:38px; }
  .filters { display:grid; grid-template-columns:minmax(190px,1.6fr) minmax(130px,1fr) minmax(160px,1fr) auto; align-items:end; gap:12px; }
  .filter { display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted); }
  .filter input,.filter select { width:100%; padding:6px 10px; font-size:14px; }
  .available { display:flex; gap:7px; align-items:center; min-height:36px; white-space:nowrap; color:var(--ink); font-size:13px; }
  input[type="checkbox"] { accent-color:var(--olive); width:15px; height:15px; }
  .list-summary { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:16px 0 8px; color:var(--muted); font-size:12px; }
  #reset-filters { min-height:28px; padding:2px 8px; font-size:12px; border-color:transparent; background:transparent; }
  .table-scroll { overflow-x:auto; }
  table { width:100%; min-width:860px; table-layout:fixed; border-collapse:collapse; text-align:left; }
  .play-column { width:58px; }
  .source-column { width:118px; }
  .time-column { width:66px; }
  .review-column { width:170px; }
  .notes-column { width:144px; }
  th { padding:7px 8px; color:var(--muted); font-size:11px; font-weight:500; border-bottom:1px solid var(--line); }
  td { padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th:first-child,td:first-child { padding-left:0; }
  th:last-child,td:last-child { padding-right:0; }
  .track.active { background:var(--wash); }
  .play-track { width:44px; height:30px; min-height:30px; padding:3px 0; font-size:12px; }
  .track-title-wrap { display:flex; align-items:center; gap:8px; min-width:0; }
  .track-title { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; font-weight:500; }
  .metadata { font-size:12px; color:var(--muted); }
  .duration { text-align:right; font-variant-numeric:tabular-nums; font-size:12px; color:var(--muted); }
  .votes { display:flex; gap:3px; }
  .vote { min-height:28px; padding:3px 8px; font-size:12px; }
  .vote[aria-pressed="true"] { border-color:var(--olive); background:var(--wash); font-weight:650; box-shadow:inset 0 -2px var(--olive); }
  .notes-toggle { min-height:28px; padding:3px 9px; font-size:12px; }
  dialog { width:min(600px,calc(100% - 36px)); max-height:85vh; padding:20px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); }
  dialog::backdrop { background:#292c2540; }
  .dialog-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px; }
  h2 { margin:0; font-size:17px; font-weight:600; line-height:1.4; }
  #close-details { min-height:30px; padding:3px 9px; font-size:12px; }
  #provenance { margin-top:16px; color:var(--muted); font-size:12px; }
  #provenance p { margin:0 0 7px; }
  .filename { overflow-wrap:anywhere; font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; }
  .audit-note { display:flex; flex-direction:column; gap:5px; color:var(--muted); }
  textarea { width:100%; min-height:72px; padding:8px; border:1px solid #cdd0c3; border-radius:5px; resize:vertical; background:var(--surface); color:var(--ink); }
  .availability { flex:none; font-size:10px; font-weight:500; color:var(--muted); white-space:nowrap; }
  #empty { padding:34px 0; text-align:center; color:var(--muted); }
  footer { margin-top:20px; font-size:12px; color:var(--muted); }
  footer p { margin:6px 0; }
  #status { min-height:18px; color:var(--olive); }
  @media(max-width:1050px) {
    .player { grid-template-columns:minmax(160px,1fr) auto; gap:10px 18px; }
    audio { grid-column:1 / -1; }
  }
  @media(max-width:760px) {
    main { padding:22px 18px 36px; }
    header { gap:12px; }
    h1 { font-size:22px; }
    .filters { grid-template-columns:1fr 1fr; gap:10px; }
    .filter:first-child { grid-column:1 / -1; }
    .available { grid-column:1 / -1; }
    .player { padding:12px 0; }
  }
  @media(prefers-reduced-motion:no-preference) { button { transition:background-color .1s,border-color .1s; } }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="page-title">Saxophone listening</h1>
    <button id="export-audit" type="button">Export audit</button>
  </header>
  <section class="player" aria-label="Recording player">
    <div class="player-copy"><span id="now-playing">Choose a recording</span><span id="player-detail">Original pitch · normal speed</span></div>
    <div class="transport"><button id="previous" type="button" aria-label="Play previous visible recording">Previous</button><button id="next" type="button" aria-label="Play next visible recording">Next</button><button id="repeat" type="button" aria-pressed="false">Repeat</button></div>
    <audio id="audio-player" controls preload="none" controlslist="nodownload noplaybackrate" aria-label="Reference audio"></audio>
  </section>
  <section class="filters" aria-label="Filter recordings">
    <label class="filter">Search<input id="search" type="search" placeholder="Name, pitch, technique…" autocomplete="off"></label>
    <label class="filter">Source<select id="source-filter"><option value="">All sources</option></select></label>
    <label class="filter">Technique<select id="technique-filter"><option value="">All techniques</option></select></label>
    <label class="available"><input id="available-only" type="checkbox" checked>Playable recordings only</label>
  </section>
  <div class="list-summary"><span id="result-count" role="status"></span><button id="reset-filters" type="button">Reset filters</button></div>
  <div class="table-scroll" tabindex="0" role="region" aria-label="Reference recordings">
    <table aria-label="Reference recordings">
      <colgroup><col class="play-column"><col><col class="source-column"><col class="time-column"><col class="review-column"><col class="notes-column"></colgroup>
      <thead><tr><th scope="col">Play</th><th scope="col">Recording</th><th scope="col">Source</th><th scope="col" class="duration">Time</th><th scope="col">Review</th><th scope="col">Notes &amp; provenance</th></tr></thead>
      <tbody id="track-list"></tbody>
    </table>
  </div>
  <p id="empty" hidden>No recordings match these filters.</p>
  <footer><p id="library-note" hidden></p><p>Notes and reviews saved in this browser.</p><p id="status" role="status" aria-live="polite"></p></footer>
</main>
<dialog id="recording-details" aria-labelledby="details-title">
  <div class="dialog-heading"><h2 id="details-title"></h2><button id="close-details" type="button">Close</button></div>
  <label class="audit-note">Listening notes<textarea rows="3" placeholder="Attack, tone, useful moments…"></textarea></label>
  <div id="provenance"></div>
</dialog>
<script id="catalog-data" type="application/json">__SAXOPHONE_CATALOG_JSON__</script>
<script>
(() => {
  'use strict';
  const catalog = JSON.parse(document.getElementById('catalog-data').textContent);
  const tracks = Array.isArray(catalog.tracks) ? catalog.tracks : [];
  const byId = new Map(tracks.map(track => [track.id, track]));
  const $ = id => document.getElementById(id);
  const audio = $('audio-player'), list = $('track-list'), details = $('recording-details');
  const storageKey = 'amaranth.saxophone-reference-audit.v1';
  let audit = {}, currentId = null, detailId = null, visible = [], storageWorks = true;
  try { const saved = JSON.parse(localStorage.getItem(storageKey) || '{}'); if (saved && typeof saved === 'object' && !Array.isArray(saved)) audit = saved; }
  catch (_) { storageWorks = false; }
  function el(tag, className, value) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (value != null) node.textContent = String(value);
    return node;
  }
  function status(message) { $('status').textContent = message; }
  function save() {
    try { localStorage.setItem(storageKey, JSON.stringify(audit)); }
    catch (_) { storageWorks = false; status('Browser storage is unavailable. Export your audit to keep it.'); }
  }
  function record(id) { if (!audit[id] || typeof audit[id] !== 'object') audit[id] = {}; return audit[id]; }
  function duration(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) return '—';
    if (seconds < 10) return `${seconds.toFixed(seconds < 1 ? 2 : 1)} s`;
    return `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2,'0')}`;
  }
  function mediaURL(track) {
    if (!track.available || !track.url) return null;
    try { const url = new URL(track.url, location.href); return ['http:','https:','file:'].includes(url.protocol) && url.origin === location.origin ? url.href : null; } catch (_) { return null; }
  }
  function sourceLink(value) {
    try { const url = new URL(value); if (['http:','https:'].includes(url.protocol)) { const link = el('a', '', 'Source page ↗'); link.href = url.href; link.target = '_blank'; link.rel = 'noopener noreferrer'; return link; } } catch (_) {}
    return null;
  }
  function reviewedCount() { return tracks.filter(track => ['keep','maybe','skip'].includes(audit[track.id]?.choice)).length; }
  function summary() { $('result-count').textContent = `${visible.length} of ${tracks.length} recordings · ${reviewedCount()} reviewed`; }
  function syncPlayback() {
    list.querySelectorAll('.track').forEach(row => {
      const active = row.dataset.trackId === currentId;
      row.classList.toggle('active', active);
      const button = row.querySelector('.play-track');
      button.textContent = active && !audio.paused ? 'Pause' : 'Play';
      button.setAttribute('aria-label', `${active && !audio.paused ? 'Pause' : 'Play'} ${byId.get(row.dataset.trackId).title}`);
      if (active) button.setAttribute('aria-current', 'true'); else button.removeAttribute('aria-current');
    });
  }
  async function play(track) {
    const url = mediaURL(track);
    if (!url) return;
    if (currentId === track.id && !audio.paused) { audio.pause(); return; }
    if (currentId !== track.id) { audio.pause(); currentId = track.id; audio.src = url; }
    audio.playbackRate = 1; audio.preservesPitch = true;
    $('now-playing').textContent = track.title;
    $('player-detail').textContent = [track.source, track.instrument, track.kind, duration(track.durationSeconds)].filter(Boolean).join(' · ');
    try { await audio.play(); record(track.id).lastPlayedAt = new Date().toISOString(); save(); status(''); }
    catch (_) { status('This recording could not play. Check that its local media file is present.'); }
    syncPlayback();
  }
  function makeTrack(track) {
    const row = el('tr', 'track'); row.dataset.trackId = track.id;
    const button = el('button', 'play-track', 'Play'); button.type = 'button'; button.disabled = !mediaURL(track); button.addEventListener('click', () => play(track));
    const playCell = el('td'); playCell.append(button);
    const titleCell = el('td');
    const titleWrap = el('div', 'track-title-wrap');
    const title = el('span', 'track-title', track.title || track.originalFilename); titleWrap.append(title);
    if (track.reserved || !mediaURL(track)) titleWrap.append(el('span', 'availability', track.reserved && !track.available ? 'Reserved · not loaded' : !mediaURL(track) ? 'Not available locally' : 'Reserved reference'));
    titleCell.append(titleWrap);
    row.append(playCell, titleCell, el('td', 'metadata', track.source), el('td', 'duration', duration(track.durationSeconds)));
    const reviewCell = el('td');
    const votes = el('div', 'votes'); votes.setAttribute('role','group'); votes.setAttribute('aria-label', `Judgment for ${track.title}`);
    ['keep','maybe','skip'].forEach(choice => {
      const vote = el('button', 'vote', choice[0].toUpperCase() + choice.slice(1)); vote.type = 'button'; vote.dataset.choice = choice;
      vote.setAttribute('aria-pressed', String(audit[track.id]?.choice === choice));
      vote.addEventListener('click', () => {
        record(track.id).choice = audit[track.id]?.choice === choice ? null : choice; save();
        votes.querySelectorAll('button').forEach(peer => peer.setAttribute('aria-pressed', String(record(track.id).choice === peer.dataset.choice)));
        summary(); if (storageWorks) status('Audit saved in this browser.');
      });
      votes.append(vote);
    });
    reviewCell.append(votes); row.append(reviewCell);
    const notesCell = el('td', 'track-details');
    const notesButton = el('button', 'notes-toggle', audit[track.id]?.note ? 'Notes ✓' : 'Notes'); notesButton.type = 'button';
    notesButton.setAttribute('aria-label', `Notes and provenance for ${track.title}`);
    notesButton.addEventListener('click', () => showDetails(track));
    notesCell.append(notesButton); row.append(notesCell);
    return row;
  }
  function showDetails(track) {
    detailId = track.id;
    $('details-title').textContent = track.title;
    details.querySelector('textarea').value = typeof audit[track.id]?.note === 'string' ? audit[track.id].note : '';
    const provenance = $('provenance'); provenance.replaceChildren();
    provenance.append(el('p', '', [track.source, track.instrument, track.kind].filter(Boolean).join(' · ')));
    if (track.note) provenance.append(el('p', '', track.note));
    provenance.append(el('p', '', 'Pitch and layer labels follow the source filenames.'));
    provenance.append(el('p', 'filename', track.originalFilename || ''));
    const link = sourceLink(track.sourceUrl); if (link) provenance.append(link);
    if (track.sha256) { const hash = el('p', 'filename', `SHA-256 ${track.sha256}`); provenance.append(hash); }
    details.showModal();
  }
  $('close-details').addEventListener('click', () => details.close());
  details.querySelector('textarea').addEventListener('input', event => {
    if (!detailId) return;
    record(detailId).note = event.target.value; save();
    const row = [...list.rows].find(row => row.dataset.trackId === detailId);
    if (row) row.querySelector('.notes-toggle').textContent = event.target.value ? 'Notes ✓' : 'Notes';
  });
  function render() {
    const query = $('search').value.trim().toLocaleLowerCase();
    visible = tracks.filter(track => (!$('source-filter').value || track.source === $('source-filter').value) && (!$('technique-filter').value || track.technique === $('technique-filter').value) && (!$('available-only').checked || mediaURL(track)) && (!query || [track.title,track.instrument,track.technique,track.pitch,track.dynamic,track.originalFilename,track.note].filter(Boolean).join(' ').toLocaleLowerCase().includes(query)));
    list.replaceChildren(...visible.map(makeTrack)); $('empty').hidden = visible.length > 0;
    const playable = visible.some(mediaURL); $('previous').disabled = !playable; $('next').disabled = !playable;
    summary(); syncPlayback();
  }
  function step(direction) {
    const playable = visible.filter(mediaURL); if (!playable.length) return;
    const index = playable.findIndex(track => track.id === currentId);
    const next = index < 0 ? (direction > 0 ? 0 : playable.length - 1) : (index + direction + playable.length) % playable.length;
    play(playable[next]);
  }
  [['source-filter','source'],['technique-filter','technique']].forEach(([id,key]) => {
    [...new Set(tracks.map(track => track[key]).filter(Boolean))].sort().forEach(value => { const option = el('option','',value); option.value = value; $(id).append(option); });
  });
  ['search','source-filter','technique-filter','available-only'].forEach(id => $(id).addEventListener(id === 'search' ? 'input' : 'change', render));
  $('reset-filters').addEventListener('click', () => { $('search').value = ''; $('source-filter').value = ''; $('technique-filter').value = ''; $('available-only').checked = true; render(); });
  $('previous').addEventListener('click', () => step(-1)); $('next').addEventListener('click', () => step(1));
  $('repeat').addEventListener('click', () => { audio.loop = !audio.loop; $('repeat').setAttribute('aria-pressed', String(audio.loop)); });
  ['play','pause','ended'].forEach(event => audio.addEventListener(event, syncPlayback));
  audio.addEventListener('ratechange', () => { if (audio.playbackRate !== 1) audio.playbackRate = 1; });
  audio.addEventListener('error', () => { if (currentId) status('This recording could not load. Check that its local media file is present.'); });
  $('export-audit').addEventListener('click', () => {
    const output = {title:catalog.title, exportedAt:new Date().toISOString(), recordings:tracks.map(track => ({id:track.id, source:track.source, originalFilename:track.originalFilename, sourceUrl:track.sourceUrl, sha256:track.sha256, ...(audit[track.id] || {})}))};
    const url = URL.createObjectURL(new Blob([JSON.stringify(output,null,2)], {type:'application/json'}));
    const link = el('a'); link.href = url; link.download = 'saxophone-reference-audit.json'; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url),1000);
    status('Audit exported.');
  });
  if (catalog.title) { $('page-title').textContent = catalog.title; document.title = catalog.title; }
  const reserved = tracks.filter(track => track.reserved && !track.available).length;
  const unavailable = tracks.filter(track => !mediaURL(track) && !(track.reserved && !track.available)).length;
  $('library-note').hidden = !(reserved || unavailable);
  $('library-note').textContent = [reserved ? `${reserved} reserved references omitted from playback` : '', unavailable ? `${unavailable} unavailable locally` : ''].filter(Boolean).join(' · ');
  if (!storageWorks) status('Browser storage is unavailable. Export your audit to keep it.');
  render();
})();
</script>
</body>
</html>
